name: Kairos Image
run-name: Deploy Kairos ${{ github.ref_name }}

on:
  push:
    # The parser validates MAJOR.MINOR.PATCH[-rc.N]; the tagged commit must be on main.
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

concurrency:
  group: personal-journal-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      image: ${{ steps.metadata.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag and resolve source commit
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          bash scripts/release_version.sh version "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          # A release must match the version maintained on its source commit.
          test "${RELEASE_TAG%%-*}" = "$(cat internal/version/VERSION)"
          # Use the checked-out commit for both lightweight and annotated tags.
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$owner/kairos" >> "$GITHUB_OUTPUT"
  frontend:
    needs: release
    uses: ./.github/workflows/frontend-tests.yml
  backend:
    needs: release
    uses: ./.github/workflows/backend-tests.yml
  image:
    needs: [release, frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Resolve the previous published release, including the CalVer transition.
          fetch-depth: 0
      - name: Verify snapshot consistency and backup failure handling
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build complete application
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile.dokploy
          platforms: linux/amd64
          load: true
          tags: kairos:verify
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            COMMIT=${{ needs.release.outputs.commit }}
          cache-from: type=gha,scope=journal
          cache-to: type=gha,scope=journal,mode=max
      - name: Verify bundled frontend and restart persistence
        run: bash scripts/release_smoke_test.sh --candidate-image kairos:verify --previous-image "$(bash scripts/release_version.sh previous-image .)"
      - name: Publish verified image
        id: publish
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          docker tag kairos:verify "$IMAGE:$RELEASE_VERSION"
          docker tag kairos:verify "$IMAGE:$RELEASE_COMMIT"
          docker tag kairos:verify "$IMAGE:production"
          docker push "$IMAGE:$RELEASE_VERSION"
          docker push "$IMAGE:$RELEASE_COMMIT"
          docker push "$IMAGE:production"
          digest=$(docker image inspect "$IMAGE:$RELEASE_VERSION" --format '{{index .RepoDigests 0}}')
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Check anonymous image access before preparing deployment
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          # Dokploy pulls the public package without the runner's publishing token.
          pull_config=$(mktemp -d)
          trap 'rm -rf "$pull_config"' EXIT
          if ! docker --config "$pull_config" manifest inspect "$IMAGE@$DIGEST" > /dev/null; then
            echo '::error::The image is not publicly readable. Set the Kairos GHCR package visibility to public and retry. Deployment preparation has not started.'
            exit 1
          fi
      - name: Prepare private deployment credentials
        id: credentials
        env:
          DEPLOY_KEY: ${{ secrets.MEMOS_PREDEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MEMOS_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.MEMOS_DEPLOY_HOST }}
        run: |
          if [ -n "$DEPLOY_KEY" ] && [ -n "$KNOWN_HOSTS" ] && [ -n "$DEPLOY_HOST" ]; then
            python3 - <<'PY'
          import os, pathlib
          for name, env in [('memos-key', 'DEPLOY_KEY'), ('memos-hosts', 'KNOWN_HOSTS')]:
              path = pathlib.Path(os.environ['RUNNER_TEMP']) / name
              # Secret entry tools may trim the final newline required by OpenSSH.
              path.write_text(os.environ[env].replace('\r\n', '\n').rstrip() + '\n')
              path.chmod(0o600)
          PY
          else
            echo '::error::Deployment credentials are incomplete; refusing an image-only release.'
            exit 1
          fi
      - name: Freeze writes and verify pre-upgrade backup
        id: prepare
        env:
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
          RELEASE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_IMAGE: ${{ needs.release.outputs.image }}
          DEPLOY_HOST: ${{ secrets.MEMOS_DEPLOY_HOST }}
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/memos-release.json"
          import hashlib, json, os, pathlib
          print(json.dumps({'commit': os.environ['RELEASE_COMMIT'], 'digest': os.environ['RELEASE_DIGEST'], 'repository': os.environ['RELEASE_IMAGE'], 'composeSha256': hashlib.sha256(pathlib.Path('scripts/compose.dokploy.yaml').read_bytes()).hexdigest()}))
          PY
          ssh -T -i "$RUNNER_TEMP/memos-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/memos-hosts" -o ConnectTimeout=15 root@"$DEPLOY_HOST" prepare < "$RUNNER_TEMP/memos-release.json"
      - name: Deploy fixed image through Dokploy API
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.MEMOS_DEPLOY_HOST }}
        run: |
          ssh -T -i "$RUNNER_TEMP/memos-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/memos-hosts" -o ConnectTimeout=15 root@"$DEPLOY_HOST" deploy
      - name: Verify public release and cancel rollback
        id: confirm
        env:
          DEPLOY_HOST: ${{ secrets.MEMOS_DEPLOY_HOST }}
          RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          deadline = time.monotonic() + 180
          while time.monotonic() < deadline:
              try:
                  request = urllib.request.Request('https://memos.cjwdream.top/api/v1/instance/profile', headers={'User-Agent': 'Kairos-Deploy/1.0'})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      profile = json.load(response)
                  if profile.get('commit') == os.environ['RELEASE_COMMIT'] and profile.get('accessMode') == 'INSTANCE_ACCESS_MODE_PRIVATE' and not profile.get('needsSetup'):
                      break
              except Exception:
                  pass
              time.sleep(3)
          else:
              raise SystemExit('Expected private production release did not become available')
          PY
          ssh -T -i "$RUNNER_TEMP/memos-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/memos-hosts" -o ConnectTimeout=15 root@"$DEPLOY_HOST" confirm
      - name: Roll back failed release without discarding new content
        id: rollback
        if: always() && steps.prepare.outcome == 'success' && steps.confirm.outcome != 'success'
        env:
          DEPLOY_HOST: ${{ secrets.MEMOS_DEPLOY_HOST }}
        run: |
          ssh -T -i "$RUNNER_TEMP/memos-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/memos-hosts" -o ConnectTimeout=15 root@"$DEPLOY_HOST" rollback > "$RUNNER_TEMP/memos-rollback.json"
